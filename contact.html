<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ - ドロマ</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--pr:#6C5CE7;--ac:#00D2D3;--bg:#07071A;--bg2:#0C0C24;--card:#151530;--tx:#fff;--tx2:#7A7A9E;--bd:rgba(255,255,255,.05);--mw:720px}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;line-height:1.7}

.bg-mesh{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-mesh::before{content:'';position:absolute;top:-20%;right:-10%;width:800px;height:800px;background:radial-gradient(circle,rgba(108,92,231,0.08) 0%,transparent 70%);animation:drift 20s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}

.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 clamp(20px,4vw,48px);height:64px;display:flex;align-items:center;background:rgba(7,7,26,.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--bd)}
.nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.nav-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--pr),var(--ac));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900}
.nav-text{font-size:22px;font-weight:900;background:linear-gradient(135deg,#fff,var(--ac));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.container{max-width:var(--mw);margin:0 auto;padding:100px 20px 60px;position:relative;z-index:2}
h1{font-size:clamp(24px,4vw,32px);font-weight:900;margin-bottom:8px}
.subtitle{color:var(--tx2);font-size:14px;margin-bottom:32px}

.form-card{background:var(--card);border-radius:20px;border:1px solid var(--bd);padding:32px;margin-bottom:24px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.form-group label .req{color:#FF5252;margin-left:4px;font-size:11px}
input,textarea,select{width:100%;padding:12px 16px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;color:#fff;font-size:14px;font-family:inherit;outline:none;transition:border .3s}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{min-height:160px;resize:vertical}
select{appearance:none;cursor:pointer}

.submit-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--pr),var(--ac));border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .3s}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,92,231,.4)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.info-box{background:rgba(108,92,231,.06);border:1px solid rgba(108,92,231,.15);border-radius:14px;padding:20px;margin-top:24px}
.info-box h3{font-size:14px;font-weight:800;margin-bottom:8px}
.info-box p{font-size:12px;color:var(--tx2);line-height:1.9}

.success{display:none;text-align:center;padding:60px 20px}
.success-icon{font-size:48px;margin-bottom:16px}
.success h2{font-size:24px;font-weight:900;margin-bottom:8px}
.success p{color:var(--tx2);font-size:14px}
.success a{display:inline-block;margin-top:20px;padding:12px 32px;background:linear-gradient(135deg,var(--pr),var(--ac));border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:14px}

.footer{text-align:center;padding:24px;font-size:11px;color:var(--tx2);border-top:1px solid var(--bd);position:relative;z-index:2}
</style>
</head>
<body>
<div class="bg-mesh"></div>

<nav class="nav">
  <a href="index.html">
    <div class="nav-icon">D</div>
    <div class="nav-text">ドロマ</div>
  </a>
</nav>

<div class="container">
  <div id="form-section">
    <h1>お問い合わせ</h1>
    <p class="subtitle">ご質問・ご意見がございましたら、お気軽にお問い合わせください。</p>

    <form id="contact-form" class="form-card" onsubmit="return handleSubmit(event)">
      <div class="form-group">
        <label>お名前<span class="req">*必須</span></label>
        <input type="text" name="name" required placeholder="お名前">
      </div>
      <div class="form-group">
        <label>メールアドレス<span class="req">*必須</span></label>
        <input type="email" name="email" required placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label>お問い合わせ種別<span class="req">*必須</span></label>
        <select name="category" required>
          <option value="">選択してください</option>
          <option value="general">一般的なお問い合わせ</option>
          <option value="account">アカウントについて</option>
          <option value="points">ポイントについて</option>
          <option value="withdrawal">出金・交換について</option>
          <option value="offer">オファー・案件について</option>
          <option value="bug">不具合報告</option>
          <option value="other">その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>お問い合わせ内容<span class="req">*必須</span></label>
        <textarea name="message" required placeholder="お問い合わせ内容をご記入ください"></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">送信する</button>
    </form>

    <div class="info-box">
      <h3>お問い合わせについて</h3>
      <p>・通常2営業日以内に返信いたします。<br>
      ・お問い合わせ内容によっては、返信にお時間をいただく場合がございます。<br>
      ・お急ぎの場合は、メールにてご連絡ください：<strong>moluta0329@gmail.com</strong></p>
    </div>
  </div>

  <div class="success" id="success-section">
    <div class="success-icon">✅</div>
    <h2>送信完了</h2>
    <p>お問い合わせありがとうございます。<br>2営業日以内にご返信いたします。</p>
    <a href="index.html">トップページに戻る</a>
  </div>
</div>

<div class="footer">&copy; 2026 ドロマ All rights reserved. | 運営: 株式会社moluta</div>

<script>
async function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '送信中...';

  const form = e.target;
  const data = {
    name: form.name.value,
    email: form.email.value,
    category: form.category.value,
    message: form.message.value,
  };

  try {
    // Discord Webhookに送信
    await fetch('https://discord.com/api/webhooks/1475714142366203955/pNz2hUvxE9VLpp4VlXYaZJtFAKWm4Mph8M-9EJF0LIdac1IKe5yYfSkvuQph0WWaxAIs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        content: '📩 **ドロマ お問い合わせ**',
        embeds: [{
          color: 0x6C5CE7,
          fields: [
            {name: '👤 お名前', value: data.name, inline: true},
            {name: '📧 メール', value: data.email, inline: true},
            {name: '📋 種別', value: data.category, inline: true},
            {name: '💬 内容', value: data.message.substring(0, 1000)},
          ],
          timestamp: new Date().toISOString(),
        }],
      }),
    });

    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-section').style.display = 'block';
  } catch {
    btn.disabled = false;
    btn.textContent = '送信する';
    alert('送信に失敗しました。メール（moluta0329@gmail.com）でお問い合わせください。');
  }
}
</script>
</body>
</html>
